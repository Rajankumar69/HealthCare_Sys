name: Build, Push and Auto-Deploy

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  DOCKER_USER: rajan69106

jobs:
  # ------------------------------------------------------------
  # JOB 1: Build & Push all 5 Docker Images to Docker Hub (Cloud)
  # ------------------------------------------------------------
  build-and-push:
    name: 1. Build and Push 5 Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'rajan69106' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || 'dckr_pat_TYEFkk0lLjGzWX86sSCd7mPQMwg' }}

      - name: Build all Docker Images
        run: |
          docker compose build

      - name: Push all Docker Images to Docker Hub
        run: |
          docker compose push

  # ------------------------------------------------------------
  # JOB 2: Auto-Deploy on Local System (Self-Hosted Runner)
  # ------------------------------------------------------------
  deploy:
    name: 2. Auto-Deploy to Docker Containers
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Pull Latest Images from Docker Hub
        run: |
          docker compose pull

      - name: Restart Healthcare System with Newest Code
        run: |
          docker compose up -d --remove-orphans
