name: Build, Push and Deploy

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  DOCKER_USER: rajan69106

jobs:
  # ------------------------------------------------------------
  # STAGE 1: Build & Push all 5 Images to Docker Hub
  # ------------------------------------------------------------
  build-and-push:
    name: 1. Build and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'rajan69106' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || 'dckr_pat_TYEFkk0lLjGzWX86sSCd7mPQMwg'}}

      - name: Build all Docker Images
        run: |
          docker compose build

      - name: Push all Docker Images to Docker Hub
        run: |
          docker compose push

  # ------------------------------------------------------------
  # STAGE 2: Deploy & Health-Check Live System
  # ------------------------------------------------------------
  deploy:
    name: 2. Deploy Healthcare System
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'rajan69106' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || 'dckr_pat_TYEFkk0lLjGzWX86sSCd7mPQMwg' }}

      - name: Pull and Deploy All 5 Containers
        run: |
          docker compose pull
          docker compose up -d

      - name: Verify Live Deployment (Health Checks)
        run: |
          echo "Waiting for services to initialize..."
          sleep 12
          docker compose ps
          echo "Testing API Gateway..."
          curl -f http://localhost:5000
          echo "Testing Frontend Application..."
          curl -f http://localhost:4200
          echo "Healthcare System successfully deployed and verified!"
